              - PLAYING_SURFACE
              - ORGANISATION_ANCESTOR
              - FULFILMENT_PROVIDER
              - ADMIN_ROLE
              - PARTICIPANT_ROLE
          description: The filter entity type. Must be one of the filter entity types configured on your subscription.
        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid
          description: The entity ID to remove from the filter.
      responses:
        '200':
          description: Entity ID successfully removed from the filter. Response body is empty.
