  adminInvited:
    post:
      summary: Admin Invited
      description: The admin invited webhook captures information about when an admin is invited to a given organisation. A filter has been established so that a consumer can filter for specific admin role types. Please note, an admin profile can have a role at multiple organisations at any point in time.
      operationId: adminInvited
      tags:
        - Admins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OutboundMessage'
                - $ref: '#/components/schemas/Filters'
                - type: object
                  properties:
                    filters:
                      type: array
                      items:
                        properties:
                          entityType:
                            type: string
                            enum:
                              - ADMIN_ROLE
                          entityId:
                            type: string
                            description: id of the entity type
                            enum:
                              - SUPER_ADMIN
                              - FULL_ACCESS
                              - ELECTRONIC_SCORING_ADMIN
                              - ADMIN_BODY
                              - AFFILIATE_ADMIN
                              - CLUB_ADMIN
                    eventType:
                      type: string
                      enum:
                        - ADMIN.INVITED
                    data:
                      $ref: '#/components/schemas/AdminPayload'
            example:
              - messageId: eed1b33c-14be-4e49-b051-698ea3123936
                eventType: ADMIN.INVITED
                entityId: 0b2199fc-7c99-4287-aa15-2174069411bc
