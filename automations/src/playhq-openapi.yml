    GradePayload:
      allOf:
        - $ref: '#/components/schemas/BaseEventPayload'
        - type: object
          properties:
            seasonId:
              type: string
              format: uuid
              description: Competition Season Id that grade belongs to
            gradeName:
              type: string
              description: Free entry text box to describe grade
            day:
              type: string
              description: Week day the grade’s game occurs.
              nullable: true
            ageGroup:
              type: string
              description: Age Group for the Grade
              nullable: true
            gender:
              type: string
              description: Grade gender settings
              nullable: true
            division:
              type: string
              description: Free entry optional text box for division groupings
              nullable: true
            visible:
              type: boolean
              description: Flags whether or not Grade should be visible on PlayHQ.com
            lastVisibleRound:
              type: string
              description: Last visible round to display publicly
              nullable: true
            hideScores:
              type: boolean
              description: Flag to indicate if scores and outcomes can display on public sites
            lineupPublishing:
              type: object
              description: Lineup publishing visibility setting
              nullable: true
              properties:
                type:
                  type: string
                  description: Setting of when lineups can be published publicly
                beforeGameStartHours:
                  type: number
                  description: Number of hours before game start time lineup can be published
                  nullable: true
                lineupRemainsWhenGameStarted:
                  type: boolean
                  description: Flag to indicate if lineups can remain published once game started
                  nullable: true
              required:
                - type
            rolloverSourceId:
              type: string
              description: Source grade id from which the rollover was performed
              nullable: true
            type:
              type: string
              description: Type of grade
              enum:
                - REGULAR
                - BYE
                - CUP_COMPETITION
                - FRIENDLIES
                - PRACTICE
                - PRE_SEASON
                - SCHOOL
          required:
            - id
            - gradeName
            - seasonId
            - visible
            - hideScores
    GradeFixturePayload:
      allOf:
        - type: object
          properties:
            id:
              description: Grade id. Please abide by grade visibility settings within the Grade webhook.
              type: string
              format: uuid
            rounds:
              description: Array of objects (defined below). Please abide by round visibility settings within the Grade webhook.
              type: array
              items:
                type: object
                properties:
                  id:
                    description: Round Id
                    type: string
                    format: uuid
                  name:
                    description: Round Name
                    type: string
