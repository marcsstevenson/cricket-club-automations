                    description: Array of teams that are byes per round
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        teamId:
                          description: PlayHQ’s unique identifier for each bye team per round
                          type: string
                          format: uuid
                      required:
                        - teamId
                  games:
                    description: Array of objects (defined below)
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          description: Game UUID
                          type: string
                          format: uuid
                        status:
                          description: Status of game
                          type: string
                        type:
                          description: Game Type
                          type: string
                        createdAt:
                          description: Game Created At timestamp
                          type: string
                        updatedAt:
                          description: Game last updated at timestamp
                          type: string
