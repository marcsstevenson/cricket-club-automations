                          description: Optional Pool grouping within each grade - Object (defined below)
                          type: object
                          nullable: true
                          properties:
                            id:
                              description: Pool identifier
                              type: string
                              format: uuid
                            name:
                              description: Pool name
                              type: string
                              nullable: true
                          required:
                            - id
                        schedule:
                          description: Array of objects (defined below)
                          type: array
                          nullable: true
                          items:
                            type: object
                            properties:
                              day:
                                description: Schedule day
                                type: string
                                nullable: true
                              dateTime:
                                description: UTC Schedule date time
                                type: string
                              playingSurfaceId:
                                description: PlayHQ’s unique identifier for Playing Surface
                                type: string
                                format: uuid
                            required:
                              - dateTime
                              - playingSurfaceId
                        teams:
                          description: Array of sub objects (defined below)
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                description: PlayHQ’s unique identifier for team
                                type: string
                                format: uuid
                              isHomeTeam:
                                description: Flag to determine which team is home team per game
                                type: boolean
                            required:
                              - id
                              - isHomeTeam
                      required:
                        - id
                        - status
                        - type
                        - createdAt
                        - updatedAt
                        - teams
                required:
                  - id
                  - name
                  - abbreviatedName
                  - isFinalRound
                  - games
                  - teams
            teams:
              description: Array of sub objects containing team related attributes (defined below)
              type: array
              items:
                type: object
                properties:
                  id:
                    description: PlayHQ’s unique Identifier for each team within the fixture
                    type: string
                    format: uuid
                  name:
                    description: Team name
                    type: string
                required:
                  - id
                  - name
            playingSurfaces:
              description: Array of sub objects containing playing surface (defined below)
              type: array
              nullable: true
              items:
                type: object
                properties:
                  id:
