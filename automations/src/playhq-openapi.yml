        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid
          description: The entity ID to add to the filter.
      responses:
        '200':
          description: Entity ID successfully added to the filter. Response body is empty.
        4XX:
          $ref: '#/components/responses/ErrorResponse'
        5XX:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      summary: Remove filter entity ID
      description: Remove a single entity ID from a filter on your webhook subscription. The operation is idempotent — no error is returned if the entity ID is not present in the filter. If all entity IDs are removed, the filter reverts to its initial empty state and no events will be delivered for that subscription until at least one entity ID is re-added.
      tags:
        - Webhooks
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
          required: true
          description: Bearer {JWT_Auth_Token}
        - in: path
