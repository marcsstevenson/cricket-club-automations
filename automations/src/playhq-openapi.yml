  /partner/v1/organisations/{id}/teams:
    get:
      summary: Teams for organisation
      description: Returns the teams playing in seasons of competitions this organisation hosts, one row per team per season. Supported for associations and administrative bodies; clubs are rejected with a 400. A team is included when it is registered to one of those seasons, or when it is allocated to a visible primary grade within one. That second case covers a team that registers with its own association and is then entered into a competition run by an organisation above it, where the row comes back against the hosting organisation rather than the one the team registered with. Uses cursor-based pagination.
      tags:
        - Teams
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
          required: true
          description: Bearer {JWT_Auth_Token}
        - in: query
          name: cursor
          schema:
            type: string
          required: false
          description: Optional. If a response has `metadata.hasMore == true`, set this parameter to `metadata.nextCursor` to request the next page of results. Omit it to request the first page. The value is opaque, so pass back exactly what you were given rather than constructing one.
          example: MTAw
        - in: path
          name: id
          required: true
          schema:
            description: ID of the organisation
            type: string
      responses:
        '200':
          description: Returns list of teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.schema-11'
              examples:
                registeredWithTheOrganisationYouQueried:
                  $ref: '#/components/examples/sample'
                enteredIntoACompetitionRunAbove:
                  $ref: '#/components/examples/sample-entered-from-below'
                teamTheOrganisationCreatedItself:
                  $ref: '#/components/examples/sample-without-club'
                lastPage:
                  $ref: '#/components/examples/sample-last-page'
        '400':
          description: Returns BAD_REQUEST (400) http code when the ID belongs to a club. Query the association or administrative body above the club instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.schema-2'
              example:
                error: This API is not supported for clubs.
        '404':
          description: Returns NOT_FOUND (404) http code when no organisation exists for the supplied ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.schema-2'
              example:
                error: Organisation could not be found.
        4XX:
          $ref: '#/components/responses/ErrorResponse'
        5XX:
          $ref: '#/components/responses/ErrorResponse'
