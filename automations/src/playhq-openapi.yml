                    description: PlayHQ’s unique identifier for the player’s profile
                    type: string
                    format: uuid
                  firstName:
                    description: First name of participant
                    type: string
                  lastName:
                    description: Last name of participant
                    type: string
                required:
                  - id
            teams:
              description: Array of sub-objects containing participant profile details
              type: array
              items:
                type: object
                properties:
                  id:
                    description: PlayHQ's unique identifier for the team
                    type: string
                    format: uuid
                  name:
                    description: Team name
                    type: string
                required:
                  - id
                  - name
        metadata:
          description: Next & previous cursor information
          type: object
          properties:
            hasMore:
              type: boolean
            nextCursor:
