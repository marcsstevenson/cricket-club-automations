    response.schema:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              description: Unique identifier for each game (UUID)
              type: string
            status:
              description: Game status
              type: string
            appearances:
              description: Array of sub objects (defined below)
              type: array
              items:
                type: object
                properties:
                  id:
                    description: Participant profile unique identifier. This is the UUID associated with the participants profile rather than the participant/registration ID. In the case of fill-in players a fill-in ID will be provided.
                    type: string
                  firstName:
                    description: First name of participant
                    type: string
                  lastName:
                    description: Last name of participant
                    type: string
                  roleType:
                    description: Role type of participant. e.g. Player, Coach, Team Manager, Officials.
                    type: string
                    nullable: true
                  captainRole:
                    description: Captain role of the participant in the game. e.g. CAPTAIN, VICE_CAPTAIN.
                    type: string
                    enum:
                      - CAPTAIN
                      - VICE_CAPTAIN
                      - DEPUTY_VICE_CAPTAIN
                    nullable: true
                  bestPlayer:
                    description: Field to determine if a player was selected as best and what was their ranking
                    type: integer
                    nullable: true
                  isFillIn:
                    description: Flag to determine if fill-in player
                    type: boolean
                  isEmergency:
                    description: Flag to determine if emergency player
                    type: boolean
                  playerNumber:
                    description: Player’s number, returned as a string. Will be null for non player related roles i.e. coach.
                    type: string
                    nullable: true
                  playerPosition:
                    description: Player’s position. Will be null for non player related roles i.e. coach.
                    type: string
                    nullable: true
                    enum:
                      - FULL_BACK
                      - GOAL_SHOOTER
                      - GOAL_ATTACK
                      - WING_ATTACK
                      - WING_DEFENCE
                      - GOAL_DEFENCE
                      - WICKET_KEEPER
                      - GOAL_KEEPER
                      - BACK_POCKET_LEFT
                      - BACK_POCKET_RIGHT
                      - CENTRE_HALF_BACK
                      - HALF_BACK_FLANK_LEFT
                      - HALF_BACK_FLANK_RIGHT
                      - CENTRE
                      - WING_LEFT
                      - WING_RIGHT
                      - CENTRE_HALF_FORWARD
                      - HALF_FORWARD_FLANK_LEFT
                      - HALF_FORWARD_FLANK_RIGHT
                      - FULL_FORWARD
                      - FORWARD_POCKET_LEFT
                      - FORWARD_POCKET_RIGHT
                      - RUCK
                      - RUCK_ROVER
                      - ROVER
                      - INTERCHANGE
                      - 23RD_PLAYER
                  email:
                    description: Contact email for participant reported during registration. Will be sent using hashing algorithm. If not available for dependant profile, we will provide the account holder email in it’s place.
                    type: string
                    nullable: true
                  gender:
                    description: Participant's gender reported during registration
                    type: string
                    nullable: true
                  scoreTotal:
                    description: Participant’s total points scored within game
                    type: integer
                    nullable: true
                  scoreSubTotal:
                    description: Array of sub objects (defined below)
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        type:
                          description: Participant's subtotals score type
                          type: string
                          nullable: true
                        value:
                          description: Participant’s subtotal value per type
                          type: number
                          nullable: true
                  teamID:
                    description: Unique identifier (UUID) of player's associated team
                    type: string
                required:
                  - id
                  - firstName
                  - lastName
                  - isFillIn
                  - isEmergency
                  - teamID
            competitors:
              description: Array of sub objects containing playing teams related attributes (defined below)
              type: array
              items:
                type: object
                properties:
                  id:
                    description: Unique ID (UUID) for each team playing per game
                    type: string
                  name:
                    description: Team name
                    type: string
                  isHomeTeam:
                    description: Flag to determine which team was playing on home ground
                    type: boolean
                  outcome:
                    description: Game outcome for specified team
                    type: string
                    nullable: true
                  scoreTotal:
                    description: Team’s score total
                    type: integer
                    nullable: true
                  scoreSubTotal:
                    description: Array of sub objects (defined below)
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        type:
                          description: Game subtotals score type. i.e. Behinds Total or Goals Total.
                          type: string
                          nullable: true
                        value:
                          description: Game subtotal value per type
                          type: number
                          nullable: true
                required:
                  - id
                  - name
                  - isHomeTeam
            periods:
              description: Array of sub objects containing period scores per team (defined below)
              type: array
              nullable: true
              items:
                type: object
                properties:
                  name:
                    description: Name of period
                    type: string
                  competitors:
                    description: Array of sub objects containing playing teams related attributes (defined below)
                    type: array
