    LiveGameDetailPayload:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
              description: Unique identifier for each game
            gradeId:
              type: string
              format: uuid
              description: Grade id the game is associated to
            status:
              type: string
              description: Game status
              enum:
                - LIVE
            type:
              type: string
              description: Game Type
              enum:
                - T_20
                - ONE_DAY
                - TWO_DAY
            appearances:
              type: array
              description: Array of sub objects (defined below)
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Participant profile unique identifier
                  firstName:
                    type: string
                    description: First name of participant
                    nullable: true
                  lastName:
                    type: string
                    description: Last name of participant
                    nullable: true
                  roleType:
                    type: string
                    description: Role type of participant
                    enum:
                      - Player
                  isFillIn:
                    type: boolean
                    description: This field will flag TRUE if the player is a fill-in player or non-team player
                  playerNumber:
                    type: integer
                    description: Player's number
                    nullable: true
                  captainRole:
                    description: Captain role of the player in the game.
                    type: string
                    enum:
                      - CAPTAIN
                      - VICE_CAPTAIN
                      - DEPUTY_VICE_CAPTAIN
                    nullable: true
                  playerPosition:
                    type: string
                    description: Player’s Position
                    nullable: true
                    enum:
                      - FULL_BACK
                      - GOAL_SHOOTER
                      - GOAL_ATTACK
                      - WING_ATTACK
                      - WING_DEFENCE
                      - GOAL_DEFENCE
                      - WICKET_KEEPER
                      - GOAL_KEEPER
                      - BACK_POCKET_LEFT
                      - BACK_POCKET_RIGHT
                      - CENTRE_HALF_BACK
                      - HALF_BACK_FLANK_LEFT
                      - HALF_BACK_FLANK_RIGHT
                      - CENTRE
                      - WING_LEFT
                      - WING_RIGHT
                      - CENTRE_HALF_FORWARD
                      - HALF_FORWARD_FLANK_LEFT
                      - HALF_FORWARD_FLANK_RIGHT
                      - FULL_FORWARD
                      - FORWARD_POCKET_LEFT
                      - FORWARD_POCKET_RIGHT
                      - RUCK
                      - RUCK_ROVER
                      - ROVER
                      - INTERCHANGE
                      - 23RD_PLAYER
                  visible:
                    type: boolean
                    description: Participant profile visibility status
                    nullable: true
                  isRegisteredPlayer:
                    type: boolean
                    description: Flag to determine if player has an associated registration on PlayHQ
                  teamId:
                    type: string
                    format: uuid
                    description: Unique identifier of player's associated team
                  lineupOrder:
                    type: integer
                    description: Order of appearance in the lineup. Will be null for non player related roles, i.e. coach. This is currently only applicable to Cricket.
                    nullable: true
                required:
                  - id
                  - roleType
                  - isFillIn
                  - isRegisteredPlayer
                  - teamId
