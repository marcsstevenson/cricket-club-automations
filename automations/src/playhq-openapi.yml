                  description: PlayHQ’s unique identifier for Round
                name:
                  type: string
                  description: Round Name
                abbreviatedName:
                  type: string
                  description: Short name for round
                isFinalRound:
                  type: boolean
                  description: Flag to determine if round is final in grade
              required:
                - id
                - name
                - abbreviatedName
                - isFinalRound
            status:
              type: string
              description: Game status
              enum:
                - PENDING
                - UPCOMING
                - FINAL
                - CANCELLED
                - ABANDONED
                - IN_PROGRESS
            type:
              type: string
              description: Game Type
              enum:
                - oneDay
                - twoDay
                - t20
                - afl
                - netball
                - basketball
                - hockey
            schedule:
              type: array
              description: Array containing schedule of game
              nullable: true
              items:
                type: object
                properties:
                  day:
                    type: number
                    description: Scheduled day(s) of game
                    nullable: true
                  dateTime:
                    type: string
                    description: UTC Start time and date of game
                  playingSurfaceId:
                    type: string
                    format: uuid
                    description: PlayHQ’s unique identifier for the playingSurface the game is associated to
                required:
                  - dateTime
                  - playingSurfaceId
            appearances:
              type: array
              description: Array of sub objects (defined below)
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Participant profile unique identifier
                  firstName:
                    type: string
                    description: First name of participant
                    nullable: true
                  lastName:
                    type: string
                    description: Last name of participant
                    nullable: true
                  roleType:
                    type: string
                    description: Role type of participant
                    enum:
                      - Player
                      - Coach
                      - Team Manager
                  captainRole:
                    description: Captain role of the participant in the game. e.g. CAPTAIN, VICE_CAPTAIN.
                    type: string
                    enum:
                      - CAPTAIN
                      - VICE_CAPTAIN
                      - DEPUTY_VICE_CAPTAIN
                    nullable: true
                  isFillIn:
                    type: boolean
                    description: This field will flag TRUE if the player is a fill-in player or non-team player
                  isRegisteredPlayer:
                    type: boolean
                    description: Flag to determine if player has an associated registration on PlayHQ
                  playerNumber:
                    type: string
                    description: Player’s number, returned as a string. Omitted from the payload when the player has no number.
                  playerPosition:
                    description: Player’s position. Will be null for non player related roles i.e. coach.
                    type: string
                    enum:
                      - CENTRE_HALF_BACK
                    nullable: true
                  visible:
                    type: boolean
                    description: Participant profile visibility status
                    nullable: true
                  teamId:
                    type: string
                    format: uuid
                    description: Unique identifier of player's associated team
                    nullable: true
                  lineupOrder:
                    type: integer
                    description: Order of appearance in the lineup. Will be null for non player related roles, i.e. coach. This is currently only applicable to Cricket.
                    nullable: true
                required:
                  - id
                  - roleType
                  - isFillIn
                  - isRegisteredPlayer
            teams:
              type: array
              description: Array of sub objects containing playing teams related attributes (defined below)
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Unique ID for each team playing per game
                  name:
                    type: string
                    description: Team name
                  isHomeTeam:
                    type: boolean
                    description: Flag to determine which team was playing on home ground
                  outcome:
                    type: string
                    description: Game outcome for specified team
                    nullable: true
                  organisation:
                    type: object
                    description: Organisation the team belongs to. Present when the feature is enabled.
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Organisation ID
                      name:
                        type: string
                        description: Organisation name
                    required:
                      - id
                      - name
                required:
                  - id
                  - name
                  - isHomeTeam
            coinToss:
              type: object
              description: Object of coin toss attributes (depicted below)
              nullable: true
              properties:
                winningTeamId:
                  type: string
                  format: uuid
                  description: Team Id of team who won toss
                preference:
                  type: string
                  description: Winning teams starting preference
              required:
                - winningTeamId
                - preference
            periods:
              type: array
              description: Array of sub objects containing period appearances and statistics related attributes (defined below).
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Unique identifier to reference period
                  name:
                    type: string
                    description: Name of period
                    enum:
                      - FIRST_INNINGS
                      - FIRST_QUARTER
                      - FIRST_HALF
                      - SECOND_HALF
                      - FIRST_QTR
                      - SECOND_QTR
                      - THIRD_QTR
                      - FOURTH_QTR
                      - OVERTIME
                  sequenceNo:
                    type: number
                    description: Order of sequence of periods from match start
                  teams:
                    type: array
                    description: Array of objects containing team related attributes (defined below)
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: PlayHQ’s unique identifier for team playing within period
                        status:
                          type: string
                          description: Team outcome status per period.
                          enum:
                            - ALL_OUT
                          nullable: true
                        discipline:
                          type: string
                          description: Discipline of team within current period
                          enum:
                            - BATTING
                            - BOWLING
                          nullable: true
                        statistics:
                          type: array
                          description: Array of sub objects containing team statistic related attributes (defined below)
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                description: Team’s sub-total statistic type. X in the "X_POINT_SCORE" refers to a number, e.g. 1, 2, 6 etc.
                                enum:
                                  - WIDES
                                  - LBW
                                  - MAIDENS
                                  - TOTAL_WICKETS
                                  - TOTAL_OVERS
                                  - TOTAL_RUNS
                                  - X_POINT_SCORE
                                  - TOTAL_GOALS
                                  - TOTAL_BEHINDS
                                  - TOTAL_SCORE
                              value:
                                type: string
                                description: Team’s sub-total statistic value
                            required:
                              - type
                              - value
                        fallOfWickets:
                          type: array
                          description: Array of sub objects containing fall of wicket related attributes (defined below), these fields are only applicable to Cricket.
                          nullable: true
                          items:
                            type: object
                            properties:
                              sequenceNo:
                                type: number
                                description: Order sequence of wickets captured from period start
                              appearanceId:
                                type: string
                                format: uuid
                                description: Appearance profile id of the batter who went out in the wicket
                              runs:
                                type: number
                                description: Number of runs the batting team earned when the fall of wicket occurred
                            required:
                              - sequenceNo
                              - appearanceId
                              - runs
                        appearances:
                          type: array
                          description: Array of sub objects containing playing appearances related attributes (defined below), these fields are only applicable to Cricket.
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                                description: Appearance profile id
                              displayOrder:
                                type: string
                                description: Order of sequence of appearances from period start
                                nullable: true
                              status:
                                type: string
                                description: Status of appearance
                                nullable: true
                              statistics:
                                type: array
                                description: Array of sub objects containing appearances statistics teams related attributes (defined below)
                                items:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      description: Appearance statistic type
                                      enum:
                                        - CURRENT_BALLS_FACED
                                        - CURRENT_RUNS
                                        - BALLS_FACED
                                        - TOTAL_RUNS
                                        - STRIKE_RATE
                                        - FOURS
                                        - SIXES
                                        - CURRENT_BALLS
                                        - RUNS
                                        - OVERS
                                        - ECONOMY
                                        - OVERS_BOWLED
                                        - WICKETS
                                        - WIDES
                                        - MAIDENS
                                        - NO_BALLS
                                        - RUN_OUTS_UNASSISTED
                                        - TOTAL_CATCHES
                                        - RUN_OUTS_ASSISTED
                                        - CATCHES_AS_WICKET_KEEPER
                                        - CATCHES_AS_FIELDER
                                        - TOTAL_RUN_OUTS
                                        - STUMPINGS
                                    value:
                                      type: number
                                      description: This is the number of occurrences of stat type per team
                                required:
                                  - type
                                  - value
                          required:
                            - id
                            - statistics
                      required:
                        - id
                        - statistics
                        - fallOfWickets
                        - appearances
                  sharedStatistics:
                    type: array
                    description: Array of sub objects containing statistics that are shared with multiple participants (defined below)
                    items:
                      type: object
                      properties:
                        appearances:
                          type: array
                          description: Array of sub objects indicating the  participants and role type for each shared stat (defined below)
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                                description: Profile Id of the appearance involved in shared statistic
                              role:
                                type: string
                                description: Appearance role involved in shared statistic
                            required:
                              - id
                              - role
                        type:
                          type: string
                          description: Shared statistic type
                      required:
                        - appearances
                        - type
                required:
                  - id
                  - name
                  - sequenceNo
                  - teams
                  - sharedStatistics
            game:
              type: object
              description: Objects containing the game appearances/team statistics that have changed due to the current event (defined below), this field only applicable for Non-cricket sports e.g. AFL, Basketball, Netball, Hockey.
              properties:
                teams:
                  type: array
                  description: Array of sub objects containing team related attributes (defined below)
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique identifier for the team
                      statistics:
                        type: array
                        description: Array of sub objects containing team statistic related attributes (defined below)
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              description: Name of team statistic.
                              enum:
                                - TOTAL_GOALS
                                - TOTAL_BEHINDS
                                - TOTAL_SCORE
                            value:
                              type: number
                              description: Value of team statistic
                          required:
                            - type
                            - value
                      appearances:
                        type: array
                        description: Array of sub objects containing playing appearances related attributes (defined below)
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: Profile id
                            statistics:
                              type: array
                              description: Array of sub objects containing appearances statistics teams related attributes (defined below)
                              items:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    description: Name of player statistic, to include the running progress score. X in the "X_POINT_SCORE" refers to a number, e.g. 1, 2, 6 etc.
                                    enum:
                                      - X_POINT_SCORE
                                      - APPEARANCE
                                      - BEST_PLAYER
                                      - YELLOW_CARD
                                      - RED_CARD
                                      - GOAL_COUNT
                                      - TOTAL_GOALS
                                      - TOTAL_BEHINDS
                                      - TOTAL_SCORE
                                      - PERSONAL_FOUL
                                      - TECHNICAL_FOUL
                                      - UNSPORTSMANLIKE_FOUL
                                      - DISQUALIFYING_FOUL
                                      - TOTAL_FOULS
                                  value:
                                    type: number
                                    description: Value of statistic
                                required:
                                  - type
                                  - value
                          required:
                            - id
                            - statistics
                    required:
                      - id
                      - statistics
            playingSurfaces:
              type: array
              description: Array of sub objects containing playing surface (defined below)
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: PlayHQ’s unique identifier for playing surface
                  name:
                    type: string
                    description: Playing surface name
                  abbreviatedName:
                    type: string
                    description: Playing surface abbreviated name
                    nullable: true
                  latitude:
                    type: string
                    description: Latitude of the Playing Surface
                    nullable: true
                  longitude:
                    type: string
                    description: Longitude of the Playing Surface
                    nullable: true
                  venue:
                    type: object
                    description: Object containing playing surface (defined below)
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: PlayHQ’s unique id for venue
                      name:
                        type: string
                        description: Venue name
                      timezone:
                        type: string
                        description: IANA Timezone Database of Venue and Playing Surface
                    required:
                      - id
                      - name
                      - timezone
                required:
                  - id
                  - name
                  - venue
            grade:
              type: object
              description: Grade the game is associated to. Present when the feature is enabled.
              properties:
                id:
                  type: string
                  format: uuid
                  description: Grade ID
                name:
                  type: string
                  description: Grade name
              required:
                - id
                - name
            hostOrganisation:
              type: object
              description: Host organisation for the game. Present when the feature is enabled.
              properties:
                id:
                  type: string
                  format: uuid
                  description: Organisation ID
                name:
                  type: string
                  description: Organisation name
              required:
                - id
                - name
          required:
            - id
            - gradeId
            - round
            - status
            - type
            - appearances
            - teams
            - periods
            - playingSurfaces
