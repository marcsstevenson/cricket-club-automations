                  id:
                    type: string
                  startDate:
                    type: string
                  startTime:
                    type: string
                  matchDayNumber:
                    type: object
                    properties:
                      name:
                        type: string
                      sequenceNo:
                        type: number
                  homeTeam:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                  awayTeam:
                    type: object
                    properties:
                      id:
