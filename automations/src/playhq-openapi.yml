openapi: 3.0.0
info:
  title: PlayHQ External API
  version: 1.0.0
  description: The PlayHQ External API provides programmatic access to sports management functionality including competitions, registrations, teams, games, programs, and venues.
  contact:
    name: API Support
    url: https://support.playhq.com/
    email: help@playhq.com
servers:
  - url: https://api.playhq.com
    description: PlayHQ API server
tags:
  - name: Organisations
  - name: Competitions
  - name: Competition Seasons
  - name: Competition Season Registration Forms
  - name: Competition Season Registrations
  - name: Teams
  - name: Grades
  - name: Games
  - name: Programs
  - name: Program Seasons
  - name: Program Season Groups
  - name: Program Season Registration Forms
  - name: Program Season Registrations
  - name: Profiles
  - name: Admins
  - name: Venues
  - name: Orders
  - name: API Auth Token
  - name: Webhooks
paths:
  /auth:
    post:
      summary: Generate auth token
      description: Provides a jwt token in an object to be used for all requests to the api
      tags:
        - API Auth Token
      requestBody:
        description: A json object containing Client ID and Client Secret
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/clients.schema'
            example:
              clientId: YOUR_CLIENT_ID_HERE
              clientSecret: YOUR_CLIENT_SECRET_HERE
      responses:
        '201':
          description: Returns A json object containing access token and its expiry time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jwt.schema'
              example:
                access_token: ACCESS_TOKEN_HERE
                exp: 1588214707
        '400':
          description: Returns BAD_REQUEST (400) http code if the request is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.schema'
              example:
                status: error
                error: 'Request body is missing or malformed. Please provide {clientId: string, clientSecret: string}'
        '403':
          description: Returns FORBIDDEN (403) http code if the request is accepted but not authorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.schema'
              example:
                status: error
                error: Permission denied
  /venues:
    get:
      summary: Lists all venues
      deprecated: true
      tags:
        - Venues
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
          required: true
          description: Bearer {JWT_Auth_Token}
        - in: query
          name: page
          schema:
            type: number
            default: 1
            minimum: 0
          description: Page Number to fetch data - the maximum value of this parameter will be equal to the totalPages in response metadata
        - in: query
          name: limit
          schema:
            type: number
            default: 10
            minimum: 1
            maximum: 100
          description: Number of objects per page to return
        - in: query
          name: changedSince
          schema:
            type: string
          description: Date in ISO 8601 format to fetch updates since
      responses:
        '200':
          description: Returns list of venues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/venues.schema'
              example:
                data:
                  venues:
                    - id: dc70a97b-064a-4e60-a19a-10757442aa87
                      name: Melbourne Centre
                      abbreviatedName: ABC
                      timezone: Australia/Melbourne
                      createdAt: '2020-08-10T02:05:17.812000000Z'
                      updatedAt: '2020-08-10T07:29:20.402000000Z'
                      contact:
                        name: XYZ
                        phone: +61-123456
                        website: https://example.com
                      address:
                        line1: 1 example street
                        suburb: Fitzroy
                        postcode: '3000'
                        state: VIC
                        country: Australia
                        latitude: '123456'
                        longitude: '123456'
                      playingSurfaces:
                        - id: 8744d03a-8147-4987-afa5-ec2cbbe7de79
                          name: Court 2
                          abbreviatedName: Crt2
                          surfaceType: WOODEN_SPRUNG
                metadata:
                  page: 4
                  totalPages: 36
                  totalRecords: 355
        4XX:
          $ref: '#/components/responses/ErrorResponse'
        5XX:
          $ref: '#/components/responses/ErrorResponse'
