                - postcode
                - country
            lineItems:
              type: array
              description: Array containing individual product variants purchased in order
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Order Line item reference
                  productVariantId:
                    type: string
                    format: uuid
                    description: Unique product variant ID reference for line item
                    nullable: true
                  quantity:
                    type: integer
                    description: Ordered quantity per line item
                  customFieldAnswers:
                    type: array
                    description: Optional array of custom field answers
                    nullable: true
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Custom field id
                        answer:
                          type: string
                          description: This is the answer of custom question setup on the product
                      required:
                        - id
