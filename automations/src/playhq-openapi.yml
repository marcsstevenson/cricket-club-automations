                            - 2_POINT_SCORE
                            - 3_POINT_SCORE
                            - 6_POINT_SCORE
                            - 9_POINT_SCORE
                            - APPEARANCE
                            - BENCH_TECHNICAL_FOUL
                            - BEST_PLAYER
                            - DISQUALIFYING_FOUL
                            - GOAL_COUNT
                            - PERSONAL_FOUL
                            - RED_CARD
                            - TECHNICAL_FOUL
                            - TOTAL_BEHINDS
                            - TOTAL_FOULS
                            - TOTAL_GOALS
                            - TOTAL_SCORE
                            - UNSPORTSMANLIKE_FOUL
                            - YELLOW_CARD
                        value:
                          description: Value of statistic
                          type: number
                      required:
                        - type
                        - value
