    LiveGameScoreEvent:
      allOf:
        - type: object
          properties:
            eventId:
              type: string
              format: uuid
              description: Event id
            timestamp:
              type: string
              description: UTC timestamp occurrence of event
            eventStartTimestamp:
              type: string
              description: UTC timestamp occurrence for the beginning of the event
              nullable: true
            gameTime:
              type: array
              description: Array containing the sport specific description of the time of the game e.g. clock for Basketball or overs for Cricket
              items:
                type: object
                properties:
                  type:
                    type: string
                    description: Type of game time
                    enum:
                      - OVER_NUMBER
                      - TOTAL_BALLS
                      - LEGAL_BALLS
                  value:
                    type: number
                    description: Value for each type
                required:
                  - type
                  - value
            gameId:
              type: string
              format: uuid
              description: Unique identifier for each game
            event:
              type: object
              description: Objects containing the event related attributes (defined below)
              properties:
                type:
                  type: string
                  description: Flag to determine event type
                  enum:
                    - BALL
                    - START_BREAK
                    - END_BREAK
                    - NON_BALL_DISMISSAL
                appearances:
                  type: array
                  description: Array of sub objects containing playing appearances related attributes (defined below)
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Appearance Id involved in the event
                      role:
                        type: string
                        description: Role of appearance involved in the event
                        nullable: true
                        enum:
                          - BATTING
                          - BOWLING
                      statistics:
                        type: array
                        description: Array of statistics captured in the event
                        nullable: true
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              description: Type of statistic
                              enum:
                                - RUNS
                            value:
                              type: number
                              description: Value of statistic
                          required:
                            - type
                            - value
                    required:
                      - id
                teams:
                  type: array
                  description: Array of sub objects containing team statistic related attributes (defined below)
                  nullable: true
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique identifier for the team
                      statistics:
                        type: array
                        description: Array of sub objects containing team statistic related attributes (defined below)
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              description: Type of team statistic
                              enum:
                                - EXTRA_WIDES
                                - EXTRA_BYES
                                - EXTRA_NO_BALLS
                                - EXTRA_LEG_BYES
                                - EXTRA_PENALTY_RUNS
                            value:
                              type: number
                              description: Value of team statistic
                          required:
                            - type
                            - value
                    required:
                      - id
                      - statistics
                sharedStatistics:
                  type: array
                  description: Array of sub objects containing statistics that are shared with multiple participants (defined below)
                  items:
                    type: object
                    properties:
                      appearances:
                        type: array
                        description: Array of sub objects indicating the participants and role type for each shared stat (defined below)
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: Appearance Id involved in shared statistic
                            role:
                              type: string
                              description: Role of appearance involved in shared statistic
                              enum:
                                - BATTING
                                - BOWLING
                                - FIELDING
                                - ASSISTANT_FIELDING
                            position:
                              type: string
                              nullable: true
                              description: Position of fielder if role is FIELDING and type is CAUGHT
                              enum:
                                - WICKET_KEEPER
                          required:
                            - id
                            - role
                      type:
                        type: string
                        description: Name of shared statistic
                        enum:
                          - CAUGHT
                          - BOWLED
                          - RUN_OUT
                          - STUMPED
                          - HIT_BALL_TWICE
                          - HIT_WICKET
                          - LEG_BEFORE_WICKET
                          - OBSTRUCTING_FIELD
