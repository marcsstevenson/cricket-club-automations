  /partner/v2/games/{id}/summary:
    get:
      summary: Summary for game V2 (Private)
      description: Game Summary detail for specified game available both pre and post game including participant line up information and statistics. Unlike the public equivalent this endpoint is organisation scoped and does not apply PlayHQ.com visibility settings, so games in hidden grades are returned to authorised partners; if you request a game outside your organisation scope you will receive a 403. Please note, this API is not fully applicable to all territory sports, refer to v1 Private Game Summary for territory based sports such as AFL or Basketball.
      tags:
        - Games
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
          required: true
          description: Bearer {JWT_Auth_Token}
        - in: path
          name: id
          required: true
          schema:
            description: ID of the game
            type: string
      responses:
        '200':
          description: Returns list of player appearances and game summary
