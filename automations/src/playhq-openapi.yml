  /partner/v2/organisations/{id}/games:
    get:
      summary: Games for organisation by date range
      description: Games fixture and associated game information for a specified organisation within a date range.
      tags:
        - Games
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
          required: true
          description: Bearer {JWT_Auth_Token}
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the organisation
        - in: query
          name: startDate
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          required: true
          description: Start of the date range in YYYY-MM-DD format (inclusive)
        - in: query
          name: endDate
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          required: true
          description: End of the date range in YYYY-MM-DD format (inclusive). Must be on or after startDate.
        - in: query
          name: cursor
          schema:
            type: string
          required: false
          description: Cursor for the next page of results. Use the value of `metadata.nextCursor` from the previous response.
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          required: false
          description: Number of games to return per page
        - in: query
          name: visibility
          schema:
            type: string
            enum:
              - all
              - visible
              - hidden
            default: all
          required: false
          description: |
            Filter games by visibility status of their entity hierarchy.
            - `all` — return all games regardless of visibility status (default)
            - `visible` — only return games where the full entity hierarchy (organisation, competition, season, grade) is visible
            - `hidden` — only return games where any part of the entity hierarchy is not visible
      responses:
        '200':
          description: Returns list of games
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.schema-9'
