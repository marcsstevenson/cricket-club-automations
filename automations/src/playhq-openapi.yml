  /partner/v2/grades/{id}/ladder:
    get:
      summary: Ladder for grade V2 (Private)
      description: 'Retrieve a list of ladder related information per specified grade, together with the ladder configuration the administrator applied: the columns in display order, the ranking method (ladderTemplate), and the columns the ladder is ranked by (rankingFields). Unlike the public equivalent this endpoint is organisation scoped and does not apply PlayHQ.com visibility settings, so ladders for hidden grades are returned to authorised partners; a grade outside your organisation scope is reported as not found. By default every ladder and column is returned regardless of the display configuration an administrator applied, and isVisible on each tells you which is which. Pass visibility=visible to return only those configured for public display.'
      tags:
