              description: Array of sub objects containing period appearances and statistics related attributes (defined below)
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Unique identifier to reference period
                  name:
                    type: string
                    description: Name of period
                  sequenceNo:
                    type: string
                    description: Order of sequence of periods from match start
                  teams:
                    type: object
                    description: Object containing team related attributes (defined below)
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: PlayHQ’s unique identifier for team playing within period
                      status:
                        type: string
                        description: Team outcome status per period.
                        nullable: true
                      discipline:
                        type: string
                        description: Discipline of team within current period
                        nullable: true
                      statistics:
                        type: array
                        description: Array of sub objects containing team statistic related attributes (defined below)
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              description: Team’s sub-total statistic type
                            value:
                              type: string
                              description: Team’s sub-total statistic value
                          required:
                            - type
                            - value
                      fallOfWickets:
                        type: array
                        description: Array of sub objects containing fall of wicket related attributes (defined below)
                        nullable: true
                        items:
                          type: object
                          properties:
                            sequenceNo:
                              type: number
                              description: Order sequence of wickets captured from period start
                            appearanceId:
                              type: string
                              format: uuid
                              description: Appearance profile id of the batter who went out in the wicket
                            runs:
                              type: number
                              description: Number of runs the batting team earned when the fall of wicket occurred
                          required:
                            - sequenceNo
                            - appearanceId
                            - runs
                      appearances:
                        type: array
                        description: Array of sub objects containing playing appearances related attributes (defined below)
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: Appearance profile id
                            displayOrder:
                              type: string
                              description: Order of sequence of appearances from period start
                              nullable: true
                            status:
                              type: string
                              description: Status of appearance
                              nullable: true
                            statistics:
                              type: array
                              description: Array of sub objects containing appearances statistics teams related attributes (defined below)
                              items:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    description: Appearance statistic type
                                  value:
                                    type: number
                                    description: This is the number of occurrences of stat type per team
                                required:
                                  - type
                                  - value
                          required:
                            - id
                            - statistics
                    required:
                      - id
                      - statistics
                      - fallOfWickets
                      - appearances
                  sharedStatistics:
                    type: array
                    description: Array of sub objects containing statistics that are shared with multiple participants (defined below)
                    items:
                      type: object
                      properties:
                        appearances:
                          type: array
                          description: Array of sub objects indicating the  participants and role type for each shared stat (defined below)
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                                description: Profile Id of the appearance involved in shared statistic
                              role:
                                type: string
                                description: Appearance role involved in shared statistic
                              type:
                                type: string
                                description: Shared statistic type
                            required:
                              - id
                              - role
                              - type
                      required:
                        - appearances
                required:
                  - id
                  - name
                  - sequenceNo
                  - teams
                  - sharedStatistics
            playingSurfaces:
              type: array
              description: Array of sub objects containing playing surface (defined below)
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: PlayHQ’s unique identifier for playing surface
                  name:
                    type: string
                    description: Playing surface name
                  abbreviatedName:
                    type: string
                    description: Playing surface abbreviated name
                    nullable: true
                  latitude:
                    type: string
                    description: Latitude of the Playing Surface
                    nullable: true
                  longitude:
                    type: string
                    description: Longitude of the Playing Surface
                    nullable: true
                  venue:
                    type: object
                    description: Object containing playing surface (defined below)
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: PlayHQ’s unique id for venue
                      name:
                        type: string
                        description: Venue name
                      timezone:
                        type: string
                        description: IANA Timezone Database of Venue and Playing Surface
                    required:
                      - id
                      - name
                      - timezone
                required:
                  - id
                  - name
                  - venue
          required:
            - id
            - gradeId
            - round
            - status
            - type
            - appearances
            - teams
            - periods
            - playingSurfaces
