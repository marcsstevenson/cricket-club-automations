    LadderPayload:
      type: object
      properties:
        gradeId:
          type: string
          format: uuid
          description: Grade id the ladder belongs to
        ladders:
          type: array
          description: Array of ladders for the grade (defined below)
          items:
            type: object
            properties:
              headers:
                type: array
                description: Array of objects (defined below), in the column order configured by the administrator. Each standings.values array is aligned to this array by position, so read the two together to map a value to its column.
                items:
                  type: object
                  properties:
                    key:
                      type: string
                      description: Key of the column header
                    shortName:
                      type: string
                      description: Short hand name for the column header
                    fullName:
                      type: string
                      description: Full name of the column header
                    toolTip:
                      type: string
                      description: Tool tip text for the column header
                    type:
                      type: string
                      description: Whether the column is a BASIC or an ADVANCED ladder field
                      enum:
                        - BASIC
                        - ADVANCED
                    sortOrder:
                      type: integer
                      description: Position in the ranking sequence, lowest first. Absent when this column does not rank teams.
                  required:
                    - key
                    - shortName
                    - fullName
                    - toolTip
                    - type
              pool:
                type: object
                description: Optional grouping within each grade (defined below). Absent when the ladder is not split into pools.
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Pool identifier
                  name:
                    type: string
                    description: Pool name
                required:
                  - id
                  - name
              standings:
                type: array
                description: Array of objects (defined below)
                items:
                  type: object
                  properties:
                    team:
                      type: object
                      description: Object (defined below)
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Team ID
                        name:
                          type: string
                          description: Team Name
                      required:
                        - id
                        - name
                    values:
                      type: array
                      description: Array of ladder values for this team, aligned by position to this ladder's headers array. An entry is null when the team has no value for that column.
                      items:
                        type: number
                        nullable: true
                  required:
                    - team
                    - values
              type:
                type: string
                description: For advanced ladders, this is the ladder's game type. Otherwise it's 'overall' for the overall ladder.
              ladderTemplate:
                type: string
                description: The ranking method configured for this ladder
            required:
              - headers
              - standings
              - type
              - ladderTemplate
      required:
        - gradeId
        - ladders
  responses:
    ErrorResponse:
      description: Returns error messages with appropriate http code if request is malformed or not processed
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
              error:
                type: string
          example:
            status: error
            error: 'Permission Denied (CODE: 1001)'
  requestBodies:
    requestBody:
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  liveStreamingEnabled:
                    description: Boolean value to indicate if the game is enabled for livestreaming
                    type: boolean
    request.schema_requestBody:
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  firstName:
                    description: First name of the user
                    type: string
                  lastName:
                    description: Last name of the user
                    type: string
                  userId:
                    description: |
                      User ID of the referee in your system. Required for all requests — used for auditing purposes across all referee integrations.
                      Concussion entry additionally requires the referee to have been linked to their PlayHQ profile via the Link Referee to PlayHQ Profile endpoint (passing this value as externalUserId). If the linking step has not been completed, the concussion entry option will not be presented to the referee in the UI. Score entry is unaffected by whether the profile has been linked.
                    type: string
                required:
                  - firstName
                  - lastName
                  - userId
    request.schema_requestBody-2:
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  status:
                    description: Status value to indicate if the game payment contract is active or inactive
                    type: string
                    enum:
                      - ACTIVE
                      - INACTIVE
    request.schema_requestBody-3:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              provider:
                description: Your association name
                type: string
              externalUserId:
                description: User ID of the user in your system
                type: string
              profileId:
                description: The PlayHQ profile ID to link
                type: string
            required:
              - provider
              - externalUserId
              - profileId
