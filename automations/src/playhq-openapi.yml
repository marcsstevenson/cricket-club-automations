                        type: string
                      address:
                        description: Object of address attributes
                        type: object
                        nullable: true
                        properties:
                          line1:
                            description: Venue address line 1
                            type: string
                            nullable: true
                          suburb:
                            description: Venue Address Suburb
                            type: string
                          postcode:
                            description: Venue Address Postcode
                            type: string
                          state:
                            description: Venue Address State
                            type: string
                          country:
                            description: Venue Address Country
                            type: string
                          longitude:
                            description: Venue Address Longitude
                            type: number
                            nullable: true
                          latitude:
                            description: Venue Address Latitude
                            type: number
                            nullable: true
                        required:
                          - suburb
