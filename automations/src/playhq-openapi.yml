                type: string
              name:
                description: Playing surface name
                type: string
              abbreviatedName:
                description: Playing surface abbreviated name
                type: string
                nullable: true
              longitude:
                description: Longitude of the Playing Surface
                type: number
                nullable: true
              latitude:
                description: Latitude of the Playing Surface
                type: number
                nullable: true
              venue:
                description: Object containing playing surface (defined below)
                type: object
                properties:
                  id:
                    description: PlayHQ’s unique identifier (UUID) for Venue
                    type: string
                  name:
                    description: Venue Name
                    type: string
                  timezone:
                    description: IANA Timezone Database of Venue and Playing Surface
                    type: string
                  address:
                    description: Object of address attributes
                    type: object
                    nullable: true
                    properties:
                      line1:
                        description: Venue address line 1
                        type: string
                        nullable: true
                      suburb:
                        description: Venue Address Suburb
                        type: string
                      postcode:
                        description: Venue Address Postcode
                        type: string
                      state:
                        description: Venue Address State
                        type: string
                      country:
                        description: Venue Address Country
                        type: string
                      longitude:
                        description: Venue Address Longitude
                        type: number
                        nullable: true
                      latitude:
                        description: Venue Address Latitude
                        type: number
                        nullable: true
                    required:
                      - suburb
                      - postcode
                      - state
                      - country
                required:
                  - id
                  - name
                  - timezone
            required:
              - id
              - name
              - venue
      required:
        - rounds
        - teams
    response.schema-22:
      type: object
      properties:
        data:
          description: The data to be returned in the ladder collection payload in response to a request submitted directly from the PlayHQ REST API.
          type: object
          properties:
            grade:
              type: object
              properties:
                id:
                  description: Unique identifier for each grade
                  type: string
            ladders:
              type: object
              properties:
                pool:
                  type: object
                  properties:
                    id:
                      description: Pool identifier - Optional grouping within each grade
                      type: string
                      nullable: true
                    name:
                      description: Pool name
                      type: string
                      nullable: true
                standings:
                  type: array
                  items:
                    type: object
                    properties:
                      team:
                        type: object
                        properties:
                          id:
                            description: Team ID
                            type: string
                          name:
                            description: Team Name
                            type: string
                      played:
                        description: Number of games team played
                        type: integer
                      won:
                        description: Number of points for team’s game wins
                        type: integer
                      lost:
                        description: Number of points for team’s game losses
                        type: integer
                      drawn:
                        description: Number of points for team’s game draws
                        type: integer
                      byes:
                        description: Number of points for team’s game byes
                        type: integer
                      pointsFor:
                        type: number
                      pointsAgainst:
                        type: number
                      forfeits:
                        description: Number of points for team’s game forfeits
                        type: integer
                      disqualifications:
                        description: Number of points for team’s game disqualifications
                        type: integer
                      adjustments:
                        description: Any point adjustments for the team
                        type: number
                      percentage:
                        type: number
                      competitionPoints:
                        type: integer
                      pointsAverage:
                        type: number
                        nullable: true
                      ranking:
                        type: integer
    response.schema-23:
      type: object
      properties:
        gradeId:
          description: Unique identifier for each grade
          type: string
        conferences:
          description: Conferences configured on this grade, in administrator-defined order. Includes configured conferences with no allocated teams. Standings reference these by conferenceId.
          type: array
          items:
            type: object
            properties:
              id:
                description: Conference identifier
                type: string
              name:
                description: Conference name
                type: string
        ladders:
          description: Array of sub objects (defined below)
          type: array
          items:
            type: object
            properties:
              headers:
                description: Array of objects (defined below), in the column order configured by the administrator. Each standings.values array is aligned to this array by position, so read the two together to map a value to its column.
                type: array
                items:
                  type: object
                  properties:
                    name:
                      description: Name of the column header
                      type: string
                    key:
                      description: Key of the column header
                      type: string
                    shortName:
                      description: Short hand name for the column header
                      type: string
                    type:
                      description: Whether the column is a BASIC or an ADVANCED ladder field
                      type: string
                      enum:
                        - BASIC
                        - ADVANCED
                    sortOrder:
                      description: Position in the ranking sequence, lowest first. Null when this column does not rank teams.
                      type: integer
                      nullable: true
                    defaultSort:
                      description: Whether this is the primary ranking column
                      type: boolean
              ladderTemplate:
                description: The ranking method the administrator configured for this ladder. LADDER_TEMPLATE_POINTS_AVERAGE ranks by points average rather than total competition points, so a ladder using it cannot be reproduced by sorting on competition points.
                type: string
                enum:
                  - LADDER_TEMPLATE_TOTAL_COMPETITION_POINTS
                  - LADDER_TEMPLATE_POINTS_AVERAGE
                  - LADDER_TEMPLATE_MATCH_RATIO
                  - LADDER_TEMPLATE_POINTS_WON_PERCENTAGE
                  - LADDER_TEMPLATE_UNSPECIFIED
              rankingFields:
                description: The columns the ladder is ranked by, ascending by sortOrder. The first entry is the default sort column and the remainder are the tie breakers applied in order.
                type: array
                items:
                  type: object
                  properties:
                    key:
                      description: Key of the ranking column, matching a headers.key value
                      type: string
                    shortName:
                      description: Short hand name for the ranking column
                      type: string
                    fullName:
                      description: Full name of the ranking column
                      type: string
                    sortOrder:
                      description: Position of this column in the ranking sequence, lowest first
                      type: number
                    toolTip:
                      description: Tool tip text for the ranking column
                      type: string
              pool:
                description: Object (defined below)
                type: object
                nullable: true
                properties:
                  id:
                    description: Pool identifier - Optional grouping within each grade
                    type: string
                  name:
                    description: Pool name
                    type: string
              standings:
                description: Array of sub objects (defined below)
                type: array
                items:
                  type: object
                  properties:
                    team:
                      description: Object (defined below)
                      type: object
                      properties:
                        id:
                          description: Team ID
                          type: string
                        name:
                          description: Team Name
                          type: string
                    conferenceId:
                      description: Identifier of the team's allocated conference, matching an entry in conferences. Null when the team is not allocated to a conference.
                      type: string
                      nullable: true
                    values:
                      description: Array of ladder values for this team, aligned by position to the ladders.headers array returned alongside it. An entry is null when the team has no value for that column.
                      type: array
                      items:
                        type: number
                        nullable: true
              type:
                description: For advanced ladders, this is the ladder's game type. Otherwise it's 'overall' for the overall ladder.
                type: string
                nullable: true
