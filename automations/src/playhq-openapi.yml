                      description: Array of sub objects containing period appearances and statistics related attributes. The periods array will only populate for tenants who primarily report using period statistics e.g. Cricket. Please refer to the match array for end of game statistics e.g. Basketball, Netball & AFL
                      type: array
                      nullable: true
                      items:
                        type: object
                        properties:
                          name:
                            description: Name of period
                            type: string
                          sequenceNo:
                            description: Order of sequence of periods from match start
                            type: string
                            nullable: true
                          teams:
                            description: Array of sub objects containing team related attributes per period (defined below)
                            type: array
                            nullable: true
                            items:
                              type: object
                              properties:
                                id:
                                  description: PlayHQ’s unique identifier (UUID) for each team within each period
                                  type: string
                                discipline:
                                  description: Discipline of team within current period
                                  type: string
                                  nullable: true
                                outcome:
                                  description: Object of teams outcomes per period
                                  type: object
                                  nullable: true
                                  properties:
                                    status:
                                      description: Team outcome status per period. This will populate for the team that is batting and null for the bowling team
                                      type: string
                                      nullable: true
                                    statistics:
                                      description: Array of sub objects containing team outcomes (defined below)
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          type:
                                            description: Period subtotal score type per team and game
                                            type: string
                                          value:
                                            description: Period subtotal score value per team and game. This is the number of occurrences of each score type
                                            type: string
                                        required:
                                          - type
                                          - value
                                  required:
                                    - statistics
                              required:
                                - id
                        required:
                          - name
                    match:
                      description: Object of match statistics
                      type: object
                      nullable: true
                      properties:
                        teams:
                          description: Array of team statistics within each match
                          type: array
                          nullable: true
                          items:
                            type: object
                            properties:
                              id:
                                description: PlayHQ’s unique identifier (UUID) for team
                                type: string
                              discipline:
                                description: Discipline of team
                                type: string
                                nullable: true
                              outcome:
                                description: Object of teams outcomes per period
                                type: object
                                nullable: true
                                properties:
                                  status:
                                    type: string
                                    description: Team outcome status
                                    nullable: true
                                  statistics:
                                    description: Array containing match total statistics per team and game
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        type:
                                          description: Match subtotals score type per team and game
                                          type: string
                                        value:
                                          description: Match subtotal score value for team and game. This is the number of occurrences of each score type
                                          type: string
                                      required:
                                        - type
                                        - value
                                required:
                                  - statistics
                            required:
                              - id
                  required:
                    - id
                    - status
                    - type
                    - url
                    - createdAt
                    - updatedAt
                    - teams
            required:
              - id
              - name
              - abbreviatedName
              - isFinalRound
              - games
        teams:
          description: Array of sub objects containing team related attributes (defined below)
          type: array
          items:
            type: object
            properties:
              id:
                description: PlayHQ’s unique Identifier (UUID) for each team within the fixture
                type: string
              name:
                description: Team name
                type: string
            required:
              - id
              - name
        playingSurfaces:
          description: Array of sub objects containing playing surface (defined below)
          type: array
          nullable: true
          items:
            type: object
            properties:
              id:
